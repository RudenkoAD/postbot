apiVersion: v1
kind: Pod
metadata:
  name: kafka-admin
spec:
  containers:
  - name: kafka-admin
    image: kafka-admin:latest
    imagePullPolicy: Never
    env:
    - name: KAFKA_ADMIN_COMMANDS_TOPIC_NAME
      value: {{ .Values.kafkaAdminCommandsTopicName | default "kafka_admin_commands" }}
    - name: KAFKA_BOOTSTRAP_SERVERS
      value: {{.Release.Name}}-kafka
